        // --- Components ---

        function LoginView() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    let msg = "エラーが発生しました";
                    if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password") msg = "メールアドレスまたはパスワードが正しくありません";
                    if (err.code === "auth/email-already-in-use") msg = "このメールアドレスは既に登録されています";
                    setError(msg);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">

                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-rose-100 rounded-full blur-[100px] opacity-60"></div>

                    <div className="max-w-md w-full glass-card rounded-[2rem] p-10 relative z-10 animate-fade-in">

                            <div className="inline-flex items-center justify-center w-20 h-20 bg-primary-500 text-white rounded-3xl premium-shadow mb-6 animate-float">

                        </div>

                        {error && (
                            <div className="mb-6 p-4 bg-rose-50 border border-rose-100 text-rose-600 text-sm rounded-2xl flex items-center gap-3">

                        <form onSubmit={handleSubmit} className="space-y-5">

        }

        // [FIX-IME] IMEの中断を防ぐため、メモ欄専用のコンポーネントにローカルstateを持たせる。
        // compositionEnd/onChange で親にコミットし、外部更新(Firestore)はeffectで同期する。
        function MemoTextarea({ itemId, value, onCommit, className, placeholder }) {
            const [localValue, setLocalValue] = useState(value);
            const isComposing = useRef(false);

            // Firestoreからの外部更新をローカルstateに反映（composition中は無視）
            useEffect(() => {
                if (!isComposing.current) {
                    setLocalValue(value);
                }
            }, [value]);

            return (
                <textarea
                    placeholder={placeholder}
                    className={className}
                    value={localValue}
                    onCompositionStart={() => { isComposing.current = true; }}
                    onCompositionEnd={(e) => {
                        isComposing.current = false;
                        const v = e.target.value;
                        setLocalValue(v);
                        onCommit(itemId, 'memo', v);
                    }}
                    onChange={(e) => {
                        const v = e.target.value;
                        setLocalValue(v);
                        // composition中はDBへの反映を行わない（IMEの確定後にonCompositionEndで行う）
                        if (!isComposing.current) {
                            onCommit(itemId, 'memo', v);
                        }
                    }}
                />
            );
        }

        const createEmptyNurseryDetails = () => ({
            address: "",
            corporationName: "",
            phone: "",
            fax: "",
            email: "",
            directorName: "",
            deputyDirectorName: ""
        });

        function App() {
            const [user, setUser] = useState(null);
            const [nurseries, setNurseries] = useState([]);
            const [selectedId, setSelectedId] = useState("");
            const [isAddingNursery, setIsAddingNursery] = useState(false);
            const [newName, setNewName] = useState("");
            const [newRegion, setNewRegion] = useState("");
            const [newFurigana, setNewFurigana] = useState("");
            const [newDetails, setNewDetails] = useState(createEmptyNurseryDetails());
            const [searchQuery, setSearchQuery] = useState("");
            const [regionFilter, setRegionFilter] = useState("");
            const [filterStatus, setFilterStatus] = useState("all"); // "all", "completed", "uncompleted"
            const [showImportantOnly, setShowImportantOnly] = useState(false);
            const [isAuthChecking, setIsAuthChecking] = useState(true);
            const [editingNurseryId, setEditingNurseryId] = useState("");
            const [editName, setEditName] = useState("");
            const [editRegion, setEditRegion] = useState("");
            const [editFurigana, setEditFurigana] = useState("");
            const [editDetails, setEditDetails] = useState(createEmptyNurseryDetails());
            const [draggingItemId, setDraggingItemId] = useState("");
            const pdfInputRef = useRef(null);
            const pdfEditInputRef = useRef(null);
            const [pdfViewerOpen, setPdfViewerOpen] = useState(false);
            const [surveyPdfUploading, setSurveyPdfUploading] = useState(false);
            const [pdfUploadError, setPdfUploadError] = useState("");

            // [FIX-DATA-MIXING] Firestoreスナップショットのコールバックはログイン時のクロージャを
            // キャプチャするため、selectedId を ref でも管理して常に最新値を参照できるようにする。
            const selectedIdRef = useRef(selectedId);
            useEffect(() => {
                selectedIdRef.current = selectedId;
            }, [selectedId]);

            // [FIX-UX] 園を切り替えたらフィルターをリセット
            useEffect(() => {
                setFilterStatus("all");
                setShowImportantOnly(false);
            }, [selectedId]);

            useEffect(() => {
                if (!selectedNursery?.pdfUrl) setPdfViewerOpen(false);
            }, [selectedId, selectedNursery?.pdfUrl]);

            // Auth State
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setIsAuthChecking(false);
                });
                return () => unsubscribe();
            }, []);

            // [DATA-MODEL-V2] サブコレクション構造への移行
            // 旧: users/{uid} ドキュメント1個に nurseries 配列を丸ごと保存
            //      → 1園更新でも全配列を書き直すため、stale state による
            //        全データ消失事故が起きやすい構造だった。
            // 新: users/{uid}/nurseries/{nurseryId} の独立ドキュメント
            //      → 1園更新は1ドキュメントのみ書き換え。他の園は絶対に
            //        巻き込まれない。
            //
            // 起動時に旧形式が残っていれば自動で新形式へ移行する。
            // 旧 nurseries 配列は安全のため users/{uid}.nurseries_legacy_backup
            // に保管したまま消さない（万一の二重移行・参照のため）。
            const nurseriesCol = (uid) => db.collection('users').doc(uid).collection('nurseries');

            // 単一園を更新（merge）。指定したフィールドだけ変更され、他フィールドは破壊しない。
            const updateNurseryDoc = async (nurseryId, partialData) => {
                if (!user || !nurseryId) return;
                try {
                    await nurseriesCol(user.uid).doc(nurseryId).set(partialData, { merge: true });
                } catch (err) {
                    console.error("[updateNurseryDoc]", err);
                }
            };

            // 新規園を作成。
            const createNurseryDoc = async (nurseryObj) => {
                if (!user || !nurseryObj?.id) return;
                const { id, ...rest } = nurseryObj;
                try {
                    await nurseriesCol(user.uid).doc(id).set(rest);
                } catch (err) {
                    console.error("[createNurseryDoc]", err);
                }
            };

            // 園を完全削除。
            const deleteNurseryDoc = async (nurseryId) => {
                if (!user || !nurseryId) return;
                try {
                    await nurseriesCol(user.uid).doc(nurseryId).delete();
                } catch (err) {
                    console.error("[deleteNurseryDoc]", err);
                }
            };

            // 複数の園を一括更新（全園共通チェック項目の追加/削除など）。
            // updates: [{ id, data }] の配列。各 data は merge で書き込まれる。
            const batchUpdateNurseries = async (updates) => {
                if (!user || !updates?.length) return;
                try {
                    const batch = db.batch();
                    const col = nurseriesCol(user.uid);
                    updates.forEach(({ id, data }) => {
                        batch.set(col.doc(id), data, { merge: true });
                    });
                    await batch.commit();
                } catch (err) {
                    console.error("[batchUpdateNurseries]", err);
                }
            };

            // ─── Firestore Migration ──────────────────────────────────────────
            // 旧形式（users/{uid}.nurseries 配列）→ 新形式（サブコレクション）への
            // 一回限りの移行。async IIFE を useEffect 内で使ってよいのは「クリーンアップ
            // が不要な一発処理」に限る。リスナー登録は絶対にこのuseEffectに入れない。
            useEffect(() => {
                if (!user) return;
                let cancelled = false;
                const userDocRef = db.collection('users').doc(user.uid);

                (async () => {
                    try {
                        const userDoc = await userDocRef.get();
                        if (cancelled) return;
                        const data = userDoc.exists ? (userDoc.data() || {}) : {};

                        if (!userDoc.exists) {
                            // 初回ユーザー：localStorage または初期データを subcollection に投入
                            const localData = localStorage.getItem("nurseryGuidanceData");
                            const initial = localData ? JSON.parse(localData) : [{
                                id: "1",
                                name: "サンライズ保育園",
                                region: "東京都",
                                ...createEmptyNurseryDetails(),
                                checklist: defaultItems.map(i => ({ ...i, important: false }))
                            }];
                            if (cancelled) return;
                            const batch = db.batch();
                            initial.forEach(n => {
                                const { id, ...rest } = n;
                                batch.set(nurseriesCol(user.uid).doc(id), rest);
                            });
                            batch.set(userDocRef, { nurseries_migrated_to_subcol: true, schema_version: 2 });
                            await batch.commit();
                            if (!cancelled) localStorage.removeItem("nurseryGuidanceData");
                        } else if (!data.nurseries_migrated_to_subcol && Array.isArray(data.nurseries) && data.nurseries.length > 0) {
                            const subSnap = await nurseriesCol(user.uid).limit(1).get();
                            if (cancelled) return;
                            if (subSnap.empty) {
                                const batch = db.batch();
                                data.nurseries.forEach(n => {
                                    if (!n || !n.id) return;
                                    const { id, ...rest } = n;
                                    batch.set(nurseriesCol(user.uid).doc(id), rest);
                                });
                                batch.update(userDocRef, {
                                    nurseries_migrated_to_subcol: true,
                                    nurseries_legacy_backup: data.nurseries,
                                    schema_version: 2
                                });
                                await batch.commit();
                                if (!cancelled) console.info("[migration] Migrated", data.nurseries.length, "nurseries → subcollection.");
                            } else {
                                await userDocRef.update({ nurseries_migrated_to_subcol: true, schema_version: 2 });
                            }
                        }

                        // [FIX-MIGRATION-INCOMPLETE] 救済移行 (v3):
                        // 旧 nurseries 配列に存在するが subcollection に無い ID を補完。
                        // 既に subcollection にあるドキュメント（チェック進捗・メモを含む）は
                        // 絶対に触らない。配列も削除しない（バックアップとして保持）。
                        // 一回だけ実行し、フラグを立てた後は再実行しない
                        // → ユーザーが園を削除しても、次回ログインで復活させない。
                        if (!cancelled && userDoc.exists && !data.nurseries_rescued_v3
                                && Array.isArray(data.nurseries) && data.nurseries.length > 0) {
                            const allSubSnap = await nurseriesCol(user.uid).get();
                            if (cancelled) return;
                            const subIds = new Set(allSubSnap.docs.map(d => d.id));
                            const missing = data.nurseries.filter(n => n && n.id && !subIds.has(n.id));
                            if (missing.length > 0) {
                                const batch = db.batch();
                                missing.forEach(n => {
                                    const { id, ...rest } = n;
                                    batch.set(nurseriesCol(user.uid).doc(id), rest);
                                });
                                batch.update(userDocRef, {
                                    nurseries_rescued_v3: true,
                                    nurseries_rescued_v3_count: missing.length,
                                    nurseries_rescued_v3_at: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                await batch.commit();
                                if (!cancelled) console.info("[rescue] Restored", missing.length, "missing nurseries from array → subcollection.");
                            } else {
                                await userDocRef.update({
                                    nurseries_rescued_v3: true,
                                    nurseries_rescued_v3_count: 0,
                                    nurseries_rescued_v3_at: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                if (!cancelled) console.info("[rescue] No missing nurseries; subcollection is complete.");
                            }
                        }
                    } catch (e) {
                        if (!cancelled) console.error("[migration]", e);
                    }
                })();

                return () => { cancelled = true; };
            }, [user?.uid]); // uid が変わった時だけ実行。Firebaseがuserオブジェクトを
                             // 再生成しても uid が同じなら移行を再実行しない。

            // ─── Firestore Realtime Listener ──────────────────────────────────
            // 【修正ポイント】
            //   1. 移行処理と完全分離 → async IIFE 不使用。cleanup が必ず機能する。
            //   2. 依存配列を [user?.uid] に。Firebaseがuserオブジェクトを再生成しても
            //      uid が同じなら再購読しない（spurious re-subscribe 防止）。
            //   3. コールバックを同期関数に。Firebase の onSnapshot は同期コールバック前提。
            //   4. onError ハンドラを追加。エラー時もサイレントに死なない。
            const [_lastSnapshotTime, _setLastSnapshotTime] = useState(null);

            useEffect(() => {
                if (!user) return;

                const unsubscribe = nurseriesCol(user.uid).onSnapshot(
                    { includeMetadataChanges: false },
                    (snap) => {
                        const now = new Date().toLocaleTimeString('ja-JP');
                        _setLastSnapshotTime(now);
                        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        const normalized = list.map(n => ({
                            ...createEmptyNurseryDetails(),
                            ...n,
                            checklist: (n.checklist || []).map(item => ({
                                ...item,
                                important: Boolean(item.important)
                            }))
                        }));
                        setNurseries(normalized);
                        // selectedIdRef を使って最新の選択IDを参照（クロージャ問題を回避）
                        if (!selectedIdRef.current && normalized.length > 0 && window.innerWidth >= 1024) {
                            const sortKey = (n) => (n.furigana || n.reading || n.kana || n.name || "").trim();
                            const sorted = [...normalized].sort((a, b) =>
                                sortKey(a).localeCompare(sortKey(b), "ja", { sensitivity: "base" })
                            );
                            setSelectedId(sorted[0].id);
                        }
                    },
                    (err) => {
                        // onError: リスナーがエラーで死んだ場合にコンソールで即検知できる
                        console.error('[Firestore onSnapshot error]', err.code, err.message);
                    }
                );

                // cleanup は同期的に unsubscribe を持っているため、
                // Strict Mode の二重マウントでも確実にリスナーが解除される。
                return () => unsubscribe();
            }, [user?.uid]);

            const uploadSurveyReportPdfToStorage = async (uid, nurseryId, file) => {
                const ref = storage.ref(surveyReportStoragePath(uid, nurseryId));
                await ref.put(file, { contentType: file.type || "application/pdf" });
                return ref.getDownloadURL();
            };

            const downloadPdfFromUrl = async (url, filename) => {
                const res = await fetch(url);
                if (!res.ok) throw new Error("download failed");
                const blob = await res.blob();
                const objUrl = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = objUrl;
                a.download = filename || "survey_report.pdf";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(objUrl);
            };

            // Derived State
            const filteredNurseries = useMemo(() => {
                const getSortKey = (nursery) => {
                    return (nursery.furigana || nursery.reading || nursery.kana || nursery.name || "").trim();
                };

                return nurseries
                    .filter(n =>
                        (n.name || "").toLowerCase().includes(searchQuery.toLowerCase()) &&
                        (regionFilter === "" || n.region === regionFilter)
                    )
                    .sort((a, b) =>
                        getSortKey(a).localeCompare(getSortKey(b), "ja", { sensitivity: "base" })
                    );
            }, [nurseries, searchQuery, regionFilter]);

            const selectedNursery = nurseries.find(n => n.id === selectedId);

            const filteredChecklist = useMemo(() => {
                if (!selectedNursery) return [];
                return (selectedNursery.checklist || []).filter(item => {
                    if (filterStatus === "completed") return item.completed;
                    if (filterStatus === "uncompleted") return !item.completed;
                    return true;
                }).filter(item => {
                    if (!showImportantOnly) return true;
                    return item.important;
                });
            }, [selectedNursery, filterStatus, showImportantOnly]);

            const regions = Array.from(new Set(nurseries.map(n => n.region).filter(Boolean)));
            const isHiragana = (value) => /^[\u3041-\u3096\u30fc\s]+$/.test((value || "").trim());

            // [DATA-MODEL-V2] 以下すべてのハンドラは「触った園のドキュメントだけ」を
            // 書き換えます。他の園は書き込み対象になりません。
            // stale state による全データ消失事故が起きないよう、ローカル state も
            // setNurseries(prev => ...) で最新値を基に更新します。

            const handleAddNursery = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                if (!newFurigana.trim() || !isHiragana(newFurigana)) {
                    alert("フリガナは全角ひらがなで入力してください。");
                    return;
                }
                const newId = Date.now().toString();
                const items = nurseries.length > 0
                    ? nurseries[0].checklist.map(i => ({ ...i, completed: false, memo: "", completedDate: "", nextActionDate: "", important: false }))
                    : defaultItems.map(i => ({ ...i, important: false }));
                const newNursery = {
                    id: newId,
                    name: newName.trim(),
                    region: newRegion.trim(),
                    furigana: newFurigana.trim(),
                    ...newDetails,
                    checklist: items
                };
                // [DATA-MODEL-V2] 単一ドキュメント書き込みのみ。他の園は絶対に巻き込まない。
                setNurseries(prev => [...prev, newNursery]);
                await createNurseryDoc(newNursery);
                setSelectedId(newId);
                setNewName("");
                setNewRegion("");
                setNewFurigana("");
                setNewDetails(createEmptyNurseryDetails());
                setIsAddingNursery(false);
            };

            const openEditNursery = (nursery) => {
                setEditingNurseryId(nursery.id);
                setEditName(nursery.name || "");
                setEditRegion(nursery.region || "");
                setEditFurigana(nursery.furigana || "");
                setEditDetails({
                    address: nursery.address || "",
                    corporationName: nursery.corporationName || "",
                    phone: nursery.phone || "",
                    fax: nursery.fax || "",
                    email: nursery.email || "",
                    directorName: nursery.directorName || "",
                    deputyDirectorName: nursery.deputyDirectorName || ""
                });
            };

            const closeEditNursery = () => {
                setEditingNurseryId("");
                setEditName("");
                setEditRegion("");
                setEditFurigana("");
                setEditDetails(createEmptyNurseryDetails());
                setPdfUploadError("");
                if (pdfEditInputRef.current) pdfEditInputRef.current.value = "";
            };

            const handleSaveNurseryEdit = async (e) => {
                e.preventDefault();
                if (!editingNurseryId) return;
                if (!editName.trim()) {
                    alert("園名を入力してください。");
                    return;
                }
                if (!editFurigana.trim() || !isHiragana(editFurigana)) {
                    alert("フリガナは全角ひらがなで入力してください。");
                    return;
                }

                const editedFields = {
                    name: editName.trim(),
                    region: editRegion.trim(),
                    furigana: editFurigana.trim(),
                    ...editDetails
                };
                // [DATA-MODEL-V2] 該当園のドキュメントだけ更新（merge）。
                setNurseries(prev => prev.map(n =>
                    n.id === editingNurseryId ? { ...n, ...editedFields } : n
                ));
                await updateNurseryDoc(editingNurseryId, editedFields);
                closeEditNursery();
            };

            const handleDeleteNursery = async (id) => {
                if (!confirm("この保育園のデータを削除しますか？")) return;
                try {
                    await storage.ref(surveyReportStoragePath(user.uid, id)).delete();
                } catch (e) {
                    // ファイルが無い・権限などは無視
                }
                // [DATA-MODEL-V2] 該当園のドキュメントだけ削除。
                const remaining = nurseries.filter(n => n.id !== id);
                setNurseries(remaining);
                await deleteNurseryDoc(id);
                if (selectedId === id) setSelectedId(remaining.length > 0 ? remaining[0].id : "");
            };

            const firebaseStorageErrorMessage = (err) => {
                const code = err && err.code;
                if (code === "storage/unauthorized") {
                    return "Storage の権限がありません（セキュリティルールで書き込みが許可されているか、ログインしているか確認してください）。コード: storage/unauthorized";
                }
                if (code === "storage/unauthenticated") {
                    return "認証が必要です。一度ログアウトしてログインし直してください。コード: storage/unauthenticated";
                }
                if (code === "storage/quota-exceeded") {
                    return "Storage の容量上限に達しています。コード: storage/quota-exceeded";
                }
                if (code === "storage/canceled") {
                    return "アップロードがキャンセルされました。";
                }
                if (code === "storage/invalid-checksum" || code === "storage/retry-limit-exceeded") {
                    return "ネットワークエラーでアップロードに失敗しました。もう一度お試しください。コード: " + code;
                }
                return (err && err.message) ? String(err.message) : "アップロードに失敗しました。";
            };

            const handleSurveyPdfUploadFor = async (nurseryId, inputRef) => {
                const input = inputRef?.current;
                if (!user) {
                    alert("ログインしてください。");
                    return;
                }
                if (!nurseryId) {
                    alert("園が選択されていません。リストから園を選んでからアップロードしてください。");
                    return;
                }
                if (!input?.files?.length) {
                    alert("先に「調査レポート(PDF)を選択」でファイルを選んでから、「アップロード」を押してください。");
                    return;
                }
                const file = input.files[0];
                const okType =
                    file.type === "application/pdf" ||
                    file.type === "application/x-pdf" ||
                    /\.pdf$/i.test(file.name || "");
                if (!okType) {
                    alert("PDFファイルを選択してください。（現在のファイル: " + (file.name || "無名") + "）");
                    return;
                }
                setSurveyPdfUploading(true);
                setPdfUploadError("");
                try {
                    const url = await uploadSurveyReportPdfToStorage(user.uid, nurseryId, file);
                    // [DATA-MODEL-V2] 該当園のドキュメントだけ pdfUrl を更新。
                    setNurseries(prev => prev.map(n =>
                        n.id === nurseryId ? { ...n, pdfUrl: url } : n
                    ));
                    await updateNurseryDoc(nurseryId, { pdfUrl: url });
                    input.value = "";
                } catch (err) {
                    console.error(err);
                    const hint = firebaseStorageErrorMessage(err);
                    setPdfUploadError(
                        "アップロードに失敗しました: " + hint +
                        " 【確認】Firebase コンソールで Storage が有効か、ルールで survey_reports/{uid}/ への read,write がログイン済みユーザーに許可されているか。"
                    );
                } finally {
                    setSurveyPdfUploading(false);
                }
            };

            const handleSurveyPdfUploadDetail = () => handleSurveyPdfUploadFor(selectedId, pdfInputRef);
            const handleSurveyPdfUploadEdit = () => handleSurveyPdfUploadFor(editingNurseryId, pdfEditInputRef);

            const surveyPdfSafeFilename = (name) => `${(name || "hoikuen").replace(/[\\/:*?"<>|]/g, "_")}_調査レポート.pdf`;

            const handleSurveyPdfDownload = async () => {
                if (!selectedNursery?.pdfUrl) return;
                try {
                    await downloadPdfFromUrl(selectedNursery.pdfUrl, surveyPdfSafeFilename(selectedNursery.name));
                } catch (e) {
                    console.warn(e);
                    window.open(selectedNursery.pdfUrl, "_blank", "noopener,noreferrer");
                }
            };

            const handleSurveyPdfOpenPrintTab = () => {
                if (!selectedNursery?.pdfUrl) return;
                window.open(selectedNursery.pdfUrl, "_blank", "noopener,noreferrer");
            };

            const handleToggleItem = (itemId) => {
                const today = new Date().toISOString().split('T')[0];
                const target = nurseries.find(n => n.id === selectedId);
                if (!target) return;
                const newChecklist = target.checklist.map(item => {
                    if (item.id === itemId) {
                        const next = !item.completed;
                        return { ...item, completed: next, completedDate: next ? today : "" };
                    }
                    return item;
                });
                // [DATA-MODEL-V2] 選択中の園のドキュメントだけ更新。
                setNurseries(prev => prev.map(n => n.id === selectedId ? { ...n, checklist: newChecklist } : n));
                updateNurseryDoc(selectedId, { checklist: newChecklist });
            };

            const handleToggleImportant = (itemId) => {
                const target = nurseries.find(n => n.id === selectedId);
                if (!target) return;
                const newChecklist = target.checklist.map(item =>
                    item.id === itemId ? { ...item, important: !item.important } : item
                );
                setNurseries(prev => prev.map(n => n.id === selectedId ? { ...n, checklist: newChecklist } : n));
                updateNurseryDoc(selectedId, { checklist: newChecklist });
            };

            const handleUpdateItem = (itemId, field, value) => {
                const target = nurseries.find(n => n.id === selectedId);
                if (!target) return;
                const newChecklist = target.checklist.map(item =>
                    item.id === itemId ? { ...item, [field]: value } : item
                );
                setNurseries(prev => prev.map(n => n.id === selectedId ? { ...n, checklist: newChecklist } : n));
                updateNurseryDoc(selectedId, { checklist: newChecklist });
            };

            // 項目追加（全園 or この園のみ）
            const handleAddItem = (text, isGlobal) => {
                if (!text.trim()) return;
                const newItem = { id: Date.now().toString(), text: text.trim(), completed: false, memo: "", completedDate: "", nextActionDate: "", important: false };
                if (isGlobal) {
                    // 全園に同じ項目を追加：batchで各園のドキュメントを独立更新。
                    const updates = nurseries.map(n => ({
                        id: n.id,
                        data: { checklist: [...(n.checklist || []), { ...newItem }] }
                    }));
                    setNurseries(prev => prev.map(n => ({ ...n, checklist: [...(n.checklist || []), { ...newItem }] })));
                    batchUpdateNurseries(updates);
                } else {
                    const target = nurseries.find(n => n.id === selectedId);
                    if (!target) return;
                    const newChecklist = [...(target.checklist || []), newItem];
                    setNurseries(prev => prev.map(n => n.id === selectedId ? { ...n, checklist: newChecklist } : n));
                    updateNurseryDoc(selectedId, { checklist: newChecklist });
                }
            };

            const handleDeleteItemGlobal = async (itemId) => {
                if (!confirm("すべての園からこの項目を削除しますか？")) return;
                const updates = nurseries.map(n => ({
                    id: n.id,
                    data: { checklist: (n.checklist || []).filter(i => i.id !== itemId) }
                }));
                setNurseries(prev => prev.map(n => ({ ...n, checklist: (n.checklist || []).filter(i => i.id !== itemId) })));
                await batchUpdateNurseries(updates);
            };

            const handleDragStartItem = (itemId) => {
                setDraggingItemId(itemId);
            };

            const handleDragOverItem = (e) => {
                e.preventDefault();
            };

            const handleDropItem = (targetItemId) => {
                if (!draggingItemId || draggingItemId === targetItemId || !selectedId) {
                    setDraggingItemId("");
                    return;
                }

                const target = nurseries.find(n => n.id === selectedId);
                if (!target) { setDraggingItemId(""); return; }
                const list = [...(target.checklist || [])];
                const fromIndex = list.findIndex(i => i.id === draggingItemId);
                const toIndex = list.findIndex(i => i.id === targetItemId);
                if (fromIndex < 0 || toIndex < 0) { setDraggingItemId(""); return; }
                const [moved] = list.splice(fromIndex, 1);
                list.splice(toIndex, 0, moved);

                setNurseries(prev => prev.map(n => n.id === selectedId ? { ...n, checklist: list } : n));
                updateNurseryDoc(selectedId, { checklist: list });
                setDraggingItemId("");
            };

            const handleDragEndItem = () => {
                setDraggingItemId("");
            };
            const canDragReorder = filterStatus === "all" && !showImportantOnly;

            const escapeCsvCell = (value) => {
                const raw = (value ?? "").toString();
                if (raw.includes('"') || raw.includes(",") || raw.includes("\n")) {
                    return `"${raw.replace(/"/g, '""')}"`;
                }
                return raw;
            };

            const handleDownloadNurseryCsv = () => {
                const header = "地域,園名";
                const lines = nurseries.map(n => {
                    const region = escapeCsvCell(n.region || "");
                    const name = escapeCsvCell(n.name || "");
                    return `${region},${name}`;
                });
                const csv = [header, ...lines].join("\r\n");
                const blob = new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "nursery_list.csv";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            if (isAuthChecking) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="w-10 h-10 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
                </div>
            );
            if (!user) return <LoginView />;

            // [FIX-DIV-ZERO] チェックリストが0件のとき NaN% になるのを防ぐ
            const statsTotal = selectedNursery ? selectedNursery.checklist.length : 0;
            const statsCompleted = selectedNursery ? selectedNursery.checklist.filter(i => i.completed).length : 0;
            const statsPercent = statsTotal > 0 ? Math.round((statsCompleted / statsTotal) * 100) : 0;

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 md:py-12">
                    {/* ── DEBUG PANEL（動作確認用・後で削除） ── */}
                    <div style={{position:'fixed',bottom:12,right:12,zIndex:9999,background:'rgba(0,0,0,0.75)',color:'#0f0',fontFamily:'monospace',fontSize:'11px',padding:'8px 12px',borderRadius:'8px',lineHeight:1.6,pointerEvents:'none'}}>
                        <div>🗃 nurseries (React state): <b>{nurseries.length}</b></div>
                        <div>⏱ last onSnapshot: <b>{_lastSnapshotTime || '—'}</b></div>
                        <div>👤 uid: {user?.uid?.slice(0,8)}…</div>
                    </div>
                    {/* Header */}
                    <header className="flex items-center justify-between gap-6 mb-8">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-primary-600 text-white rounded-2xl premium-shadow">
                                <IconSchool />
                            </div>
                            <div>
                                <h1 className="text-xl font-heading font-bold text-gray-900 leading-tight">保育園案内コンシェルジュ</h1>
                                <p className="text-xs font-semibold text-gray-500">案内状況の管理ダッシュボード</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3 bg-white p-2 pl-4 rounded-2xl border border-gray-200 premium-shadow">
                            <div className="text-right hidden sm:block">
                                <p className="text-[11px] font-semibold text-gray-400">ログイン中</p>
                                <p className="text-sm font-semibold text-gray-700">{user.email}</p>
                            </div>
                            <button onClick={() => confirm("ログアウトしますか？") && auth.signOut()} title="ログアウト" className="p-3 bg-gray-50 text-gray-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all-custom">
                                <IconLogout />
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Sidebar: Nursery List */}
                        <aside className={`lg:col-span-4 space-y-6 ${selectedId ? 'hidden lg:block' : 'block'}`}>
                            <div className="glass-card rounded-[2rem] p-6">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-lg font-heading font-bold text-gray-800">保育園リスト</h2>
                                    <button
                                        onClick={() => setIsAddingNursery(!isAddingNursery)}
                                        className={`p-2 rounded-xl transition-all-custom ${isAddingNursery ? 'bg-rose-100 text-rose-600 rotate-45' : 'bg-primary-100 text-primary-600 hover:scale-110'}`}
                                    >
                                        <IconPlus />
                                    </button>
                                </div>

                                {/* Search & Filter */}
                                <div className="space-y-3 mb-6">
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-4 flex items-center text-gray-400"><IconSearch /></span>
                                        <input
                                            type="text"
                                            placeholder="検索..."
                                            className="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-400 transition-all outline-none text-sm"
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                    <select
                                        className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-400 transition-all outline-none text-sm appearance-none"
                                        value={regionFilter}
                                        onChange={e => setRegionFilter(e.target.value)}
                                    >
                                        <option value="">すべての地域</option>
                                        {regions.map(r => <option key={r} value={r}>{r}</option>)}
                                    </select>
                                    <button
                                        onClick={handleDownloadNurseryCsv}
                                        disabled={nurseries.length === 0}
                                        className="w-full px-4 py-3 bg-white text-primary-600 rounded-2xl border border-primary-100 text-sm font-bold hover:bg-primary-50 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        リストをCSVでダウンロード

                                <div className="flex items-center justify-between">
                                    <h3 className="text-lg font-heading font-bold text-gray-800">園情報を編集</h3>
                                    <button type="button" onClick={closeEditNursery} className="px-3 py-1 text-sm text-gray-500 hover:text-gray-700">閉じる</button>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">園名</label>
                                    <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editName} onChange={e => setEditName(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">地域</label>
                                    <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editRegion} onChange={e => setEditRegion(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">フリガナ（全角ひらがな）</label>
                                    <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editFurigana} onChange={e => setEditFurigana(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">住所（任意）</label>
                                    <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.address} onChange={e => setEditDetails(prev => ({ ...prev, address: e.target.value }))} />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">法人名（任意）</label>
                                    <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.corporationName} onChange={e => setEditDetails(prev => ({ ...prev, corporationName: e.target.value }))} />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">電話番号（任意）</label>
                                        <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.phone} onChange={e => setEditDetails(prev => ({ ...prev, phone: e.target.value }))} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">FAX番号（任意）</label>
                                        <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.fax} onChange={e => setEditDetails(prev => ({ ...prev, fax: e.target.value }))} />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1">メールアドレス（任意）</label>
                                    <input type="email" className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.email} onChange={e => setEditDetails(prev => ({ ...prev, email: e.target.value }))} />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">園長名（任意）</label>
                                        <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.directorName} onChange={e => setEditDetails(prev => ({ ...prev, directorName: e.target.value }))} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">副園長名・主任名（任意）</label>
                                        <input className="w-full px-4 py-2 rounded-xl bg-white/70 border-none focus:ring-2 focus:ring-primary-500 text-sm" value={editDetails.deputyDirectorName} onChange={e => setEditDetails(prev => ({ ...prev, deputyDirectorName: e.target.value }))} />
                                    </div>
                                </div>
                                <div className="rounded-2xl border border-primary-100 bg-primary-50/40 p-4 space-y-3">
                                    <label className="block text-xs font-bold text-gray-600">調査レポート（PDF）</label>
                                    <p className="text-[11px] text-gray-500 leading-relaxed">この園の PDF をアップロードすると Firestore の <code className="text-[10px] bg-white/80 px-1 rounded">pdfUrl</code> に保存されます（再アップロードで上書き）。</p>
                                    {nurseries.find(x => x.id === editingNurseryId)?.pdfUrl && (
                                        <p className="text-xs font-semibold text-emerald-700">現在 PDF が登録されています。</p>
                                    )}
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <label className="flex-1 cursor-pointer">
                                            <span className="block w-full text-center py-2.5 px-3 rounded-xl bg-white border border-primary-100 text-xs font-bold text-primary-700 hover:bg-primary-50 transition-all-custom">
                                                調査レポート(PDF)を選択
                                            </span>
                                            <input
                                                ref={pdfEditInputRef}
                                                type="file"
                                                accept="application/pdf,.pdf"
                                                className="hidden"
                                                onChange={() => setPdfUploadError("")}
                                            />
                                        </label>
                                        <button
                                            type="button"
                                            onClick={handleSurveyPdfUploadEdit}
                                            disabled={surveyPdfUploading || !editingNurseryId}
                                            className="sm:w-36 py-2.5 px-3 rounded-xl bg-primary-600 text-white text-xs font-bold hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all-custom"
                                        >
                                            {surveyPdfUploading ? "処理中…" : "アップロード"}
                                        </button>
                                    </div>
                                    {pdfUploadError && <p className="text-xs text-rose-600 font-medium">{pdfUploadError}</p>}
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={closeEditNursery} className="px-4 py-2 rounded-xl text-sm font-semibold text-gray-500 hover:text-gray-700">キャンセル</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-sm font-bold text-white bg-primary-600 hover:bg-primary-700">保存</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function AddItemForm({ onAdd }) {
            const [text, setText] = useState("");
            const [isExpanded, setIsExpanded] = useState(false);

            const handleSubmit = (isGlobal) => {
                if (!text.trim()) return;
                onAdd(text, isGlobal);
                setText("");
                setIsExpanded(false);
            };

            if (!isExpanded) return (
                <button
                    onClick={() => setIsExpanded(true)}
                    className="w-full py-6 border-4 border-dashed border-gray-200 rounded-[2rem] text-gray-400 hover:border-primary-300 hover:text-primary-500 transition-all-custom font-bold text-sm flex items-center justify-center gap-2"
                >
                    <IconPlus /> 新しい案内項目を追加
                </button>
            );

            return (
                <div className="glass-card rounded-[2rem] p-8 animate-fade-in-down border-2 border-primary-100 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-2 h-full bg-primary-600"></div>
                    <h4 className="text-lg font-heading font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <span className="p-1.5 bg-primary-100 text-primary-600 rounded-lg"><IconPlus /></span>
                        新しい案内項目を追加
                    </h4>
                    <div className="space-y-6">
                        <div>
                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2">項目名</label>
                            <input
                                autoFocus
                                placeholder="例：防犯カメラの設置状況を確認"
                                className="w-full px-5 py-4 rounded-2xl bg-white border-2 border-gray-100 focus:border-primary-500 focus:ring-0 outline-none text-sm transition-all"
                                value={text}
                                onChange={e => setText(e.target.value)}
                                onKeyDown={e => {
                                    if (e.key === 'Enter' && text.trim()) handleSubmit(false);
                                }}
                            />
                        </div>

                        <div className="space-y-3">
                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">追加先の範囲を選択</label>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button
                                    onClick={() => handleSubmit(true)}
                                    disabled={!text.trim()}
                                    className="group flex items-center gap-4 p-4 bg-white border-2 border-gray-100 rounded-2xl text-left hover:border-primary-500 transition-all disabled:opacity-50"
                                >
                                    <div className="p-3 bg-primary-50 text-primary-600 rounded-xl group-hover:bg-primary-600 group-hover:text-white transition-colors">
                                        <IconGlobe />
                                    </div>
                                    <div>
                                        <p className="text-sm font-bold text-gray-800">すべての園に追加</p>
                                        <p className="text-[10px] text-gray-400">共通のチェック項目として登録</p>
                                    </div>
                                </button>
                                <button
                                    onClick={() => handleSubmit(false)}
                                    disabled={!text.trim()}
                                    className="group flex items-center gap-4 p-4 bg-white border-2 border-gray-100 rounded-2xl text-left hover:border-primary-500 transition-all disabled:opacity-50"
                                >
                                    <div className="p-3 bg-rose-50 text-rose-500 rounded-xl group-hover:bg-rose-500 group-hover:text-white transition-colors">
                                        <IconHome />
                                    </div>
                                    <div>
                                        <p className="text-sm font-bold text-gray-800">この園のみに追加</p>
                                        <p className="text-[10px] text-gray-400">現在表示中の園にのみ登録</p>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <div className="flex justify-end pt-2">
                            <button
                                onClick={() => setIsExpanded(false)}
                                className="px-6 py-3 text-gray-400 font-bold text-sm hover:text-gray-600 transition-colors"
                            >
                                キャンセル
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
