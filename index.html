<html lang="ja">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保育園案内コンシェルジュ | 案内状況管理</title>
    <!-- Tailwind CSS (CDN) -->

    <!-- React & ReactDOM (CDN) -->

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel (JSXコンパイル用 CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat version for easier single-file use) -->

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f4ff',
                            100: '#e0e9fe',
                            200: '#c1d3fe',
                            300: '#92b3fd',
                            400: '#5c89fa',
                            500: '#3b66f5',
                            600: '#2546eb',
                            700: '#1d36d8',
                            800: '#1e3a8a',
                        },
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            background: radial-gradient(circle at top left, #f0f4ff 0%, #ffffff 40%, #fff1f2 100%);

            color: #1e293b;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .premium-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .transition-all-custom {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hide scrollbar for Chrome, Safari and Opera */

            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */

        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCaH8njqfP43PrWvf6e7VHwSrv21t6PUu4",
            authDomain: "hoisapo-pj.firebaseapp.com",
            projectId: "hoisapo-pj",
            storageBucket: "hoisapo-pj.firebasestorage.app",
            messagingSenderId: "49253930087",
            appId: "1:49253930087:web:a99963e9510f67d7d070c2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Constants & Defaults ---
        const defaultItems = [
            { id: "c1", text: "園の理念・方針の説明", completed: false, memo: "", completedDate: "", nextActionDate: "" },
            { id: "c2", text: "一日のスケジュール紹介", completed: false, memo: "", completedDate: "", nextActionDate: "" },
            { id: "c3", text: "給食・アレルギー対応について", completed: false, memo: "", completedDate: "", nextActionDate: "" },
            { id: "c4", text: "延長保育・料金体系の確認", completed: false, memo: "", completedDate: "", nextActionDate: "" },
            { id: "c5", text: "持ち物・準備品リストの受領", completed: false, memo: "", completedDate: "", nextActionDate: "" },
            { id: "c6", text: "緊急連絡・防犯対策の説明", completed: false, memo: "", completedDate: "", nextActionDate: "" }
        ];

        // --- Icons ---
        const IconCheck = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>;
        const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        const IconSearch = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        const IconSchool = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>;
        const IconUser = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
        const IconLogout = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>;
        const IconGlobe = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" /></svg>;
        const IconHome = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>;

        // --- Components ---

        function LoginView() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    let msg = "エラーが発生しました";
                    if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password") msg = "メールアドレスまたはパスワードが正しくありません";
                    if (err.code === "auth/email-already-in-use") msg = "このメールアドレスは既に登録されています";
                    setError(msg);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-100 rounded-full blur-[100px] opacity-60"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-rose-100 rounded-full blur-[100px] opacity-60"></div>

                    <div className="max-w-md w-full glass-card rounded-[2rem] p-10 relative z-10 animate-fade-in">
                        <div className="text-center mb-10">
                            <div className="inline-flex items-center justify-center w-20 h-20 bg-primary-500 text-white rounded-3xl premium-shadow mb-6 animate-float">
                                <IconSchool />
                            </div>
                            <h1 className="text-3xl font-heading font-bold text-gray-900 tracking-tight">
                                {isLogin ? "こんにちは！" : "Create Account"}
                            </h1>
                            <p className="text-gray-500 mt-2 font-medium">保育園案内コンシェルジュ</p>
                        </div>

                        {error && (
                            <div className="mb-6 p-4 bg-rose-50 border border-rose-100 text-rose-600 text-sm rounded-2xl flex items-center gap-3">
                                <div className="w-1.5 h-1.5 bg-rose-500 rounded-full"></div>
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2 ml-1">メールアドレス</label>
                                <input
                                    type="email"
                                    required
                                    className="w-full px-5 py-4 rounded-2xl border-none bg-white/50 focus:bg-white focus:ring-2 focus:ring-primary-500 outline-none transition-all-custom shadow-inner"
                                    placeholder="mail@example.com"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2 ml-1">パスワード</label>
                                <input
                                    type="password"
                                    required
                                    className="w-full px-5 py-4 rounded-2xl border-none bg-white/50 focus:bg-white focus:ring-2 focus:ring-primary-500 outline-none transition-all-custom shadow-inner"
                                    placeholder="••••••••"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                            </div>
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-primary-600 text-white font-bold py-4 rounded-2xl hover:bg-primary-700 hover:scale-[1.02] active:scale-[0.98] transition-all-custom premium-shadow disabled:opacity-50 mt-4"
                            >
                                {loading ? "Connecting..." : (isLogin ? "Login" : "Register")}
                            </button>
                        </form>

                        <div className="mt-8 text-center">
                            <button
                                onClick={() => setIsLogin(!isLogin)}
                                className="text-primary-600 font-semibold text-sm hover:text-primary-700 transition-colors"
                            >
                                {isLogin ? "新規登録はこちら" : "ログイン画面に戻る"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // [FIX-IME] IMEの中断を防ぐため、メモ欄専用のコンポーネントにローカルstateを持たせる。
        // compositionEnd/onChange で親にコミットし、外部更新(Firestore)はeffectで同期する。
        function MemoTextarea({ itemId, value, onCommit, className, placeholder }) {
            const [localValue, setLocalValue] = useState(value);
            const isComposing = useRef(false);

            // Firestoreからの外部更新をローカルstateに反映（composition中は無視）
            useEffect(() => {
                if (!isComposing.current) {
                    setLocalValue(value);
                }
            }, [value]);

            return (
                <textarea
                    placeholder={placeholder}
                    className={className}
                    value={localValue}
                    onCompositionStart={() => { isComposing.current = true; }}
                    onCompositionEnd={(e) => {
                        isComposing.current = false;
                        const v = e.target.value;
                        setLocalValue(v);
                        onCommit(itemId, 'memo', v);
                    }}
                    onChange={(e) => {
                        const v = e.target.value;
                        setLocalValue(v);
                        // composition中はDBへの反映を行わない（IMEの確定後にonCompositionEndで行う）
                        if (!isComposing.current) {
                            onCommit(itemId, 'memo', v);
                        }
                    }}
                />
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [nurseries, setNurseries] = useState([]);
            const [selectedId, setSelectedId] = useState("");
            const [isAddingNursery, setIsAddingNursery] = useState(false);
            const [newName, setNewName] = useState("");
            const [newRegion, setNewRegion] = useState("");
            const [searchQuery, setSearchQuery] = useState("");
            const [regionFilter, setRegionFilter] = useState("");
            const [filterStatus, setFilterStatus] = useState("all"); // "all", "completed", "uncompleted"
            const [isAuthChecking, setIsAuthChecking] = useState(true);

            // [FIX-DATA-MIXING] Firestoreスナップショットのコールバックはログイン時のクロージャを
            // キャプチャするため、selectedId を ref でも管理して常に最新値を参照できるようにする。
            const selectedIdRef = useRef(selectedId);
            useEffect(() => {
                selectedIdRef.current = selectedId;
            }, [selectedId]);

            // [FIX-UX] 園を切り替えたらフィルターをリセット
            useEffect(() => {
                setFilterStatus("all");
            }, [selectedId]);

            // Auth State
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setIsAuthChecking(false);
                });
                return () => unsubscribe();
            }, []);

            // Firestore Sync
            useEffect(() => {
                if (!user) return;
                const userDocRef = db.collection('users').doc(user.uid);
                const unsubscribe = userDocRef.onSnapshot(async doc => {
                    if (doc.exists) {
                        const data = doc.data().nurseries || [];
                        setNurseries(data);
                        // [FIX-DATA-MIXING] selectedIdRef.current を使うことで、
                        // 毎回の書き込み後スナップショットで選択が1番目にリセットされるバグを修正。
                        if (!selectedIdRef.current && data.length > 0 && window.innerWidth >= 1024) {
                            setSelectedId(data[0].id);
                        }
                    } else {
                        // 初回移行
                        const localData = localStorage.getItem("nurseryGuidanceData");
                        const initial = localData ? JSON.parse(localData) : [{ id: "1", name: "サンライズ保育園", region: "東京都", checklist: defaultItems }];
                        await userDocRef.set({ nurseries: initial });
                        localStorage.removeItem("nurseryGuidanceData");
                    }
                });
                return () => unsubscribe();
            }, [user]);

            const updateDB = async (newData) => {
                if (!user) return;
                try {
                    await db.collection('users').doc(user.uid).set({ nurseries: newData }, { merge: true });
                } catch (error) {
                    console.error("Firestore update error:", error);
                }
            };

            // Derived State
            const filteredNurseries = useMemo(() => {
                return nurseries.filter(n =>
                    (n.name || "").toLowerCase().includes(searchQuery.toLowerCase()) &&
                    (regionFilter === "" || n.region === regionFilter)
                );
            }, [nurseries, searchQuery, regionFilter]);

            const selectedNursery = nurseries.find(n => n.id === selectedId);

            const filteredChecklist = useMemo(() => {
                if (!selectedNursery) return [];
                return selectedNursery.checklist.filter(item => {
                    if (filterStatus === "completed") return item.completed;
                    if (filterStatus === "uncompleted") return !item.completed;
                    return true;
                });
            }, [selectedNursery, filterStatus]);

            const regions = Array.from(new Set(nurseries.map(n => n.region).filter(Boolean)));

            // [FIX-SIDE-EFFECT] 以下すべてのハンドラで、setNurseries の updater 関数内で
            // updateDB/setSelectedId を呼ぶ副作用パターンを修正。
            // updater は純粋関数である必要があり、副作用はその外に出す。

            const handleAddNursery = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const newId = Date.now().toString();
                const items = nurseries.length > 0
                    ? nurseries[0].checklist.map(i => ({ ...i, completed: false, memo: "", completedDate: "", nextActionDate: "" }))
                    : defaultItems;
                const updated = [...nurseries, { id: newId, name: newName, region: newRegion, checklist: items }];
                setNurseries(updated);
                updateDB(updated);
                setSelectedId(newId);
                setNewName("");
                setNewRegion("");
                setIsAddingNursery(false);
            };

            const handleDeleteNursery = async (id) => {
                if (!confirm("この保育園のデータを削除しますか？")) return;
                const updated = nurseries.filter(n => n.id !== id);
                setNurseries(updated);
                updateDB(updated);
                if (selectedId === id) setSelectedId(updated.length > 0 ? updated[0].id : "");
            };

            const handleToggleItem = (itemId) => {
                const today = new Date().toISOString().split('T')[0];
                const updated = nurseries.map(n => {
                    if (n.id === selectedId) {
                        return {
                            ...n,
                            checklist: n.checklist.map(item => {
                                if (item.id === itemId) {
                                    const next = !item.completed;
                                    return { ...item, completed: next, completedDate: next ? today : "" };
                                }
                                return item;
                            })
                        };
                    }
                    return n;
                });
                setNurseries(updated);
                updateDB(updated);
            };

            const handleUpdateItem = (itemId, field, value) => {
                const updated = nurseries.map(n => {
                    if (n.id === selectedId) {
                        return {
                            ...n,
                            checklist: n.checklist.map(item => item.id === itemId ? { ...item, [field]: value } : item)
                        };
                    }
                    return n;
                });
                setNurseries(updated);
                updateDB(updated);
            };

            // 項目追加（全園 or この園のみ）
            const handleAddItem = (text, isGlobal) => {
                if (!text.trim()) return;
                const newItem = { id: Date.now().toString(), text: text.trim(), completed: false, memo: "", completedDate: "", nextActionDate: "" };
                let updated;
                if (isGlobal) {
                    updated = nurseries.map(n => ({ ...n, checklist: [...n.checklist, newItem] }));
                } else {
                    updated = nurseries.map(n => n.id === selectedId ? { ...n, checklist: [...n.checklist, newItem] } : n);
                }
                setNurseries(updated);
                updateDB(updated);
            };

            const handleDeleteItemGlobal = async (itemId) => {
                if (!confirm("すべての園からこの項目を削除しますか？")) return;
                const updated = nurseries.map(n => ({ ...n, checklist: n.checklist.filter(i => i.id !== itemId) }));
                setNurseries(updated);
                updateDB(updated);
            };

            if (isAuthChecking) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="w-10 h-10 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
                </div>
            );
            if (!user) return <LoginView />;

            // [FIX-DIV-ZERO] チェックリストが0件のとき NaN% になるのを防ぐ
            const statsTotal = selectedNursery ? selectedNursery.checklist.length : 0;
            const statsCompleted = selectedNursery ? selectedNursery.checklist.filter(i => i.completed).length : 0;
            const statsPercent = statsTotal > 0 ? Math.round((statsCompleted / statsTotal) * 100) : 0;

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 md:py-12">
                    {/* Header */}
                    <header className="flex items-center justify-between gap-6 mb-8">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-primary-600 text-white rounded-2xl premium-shadow">
                                <IconSchool />
                            </div>
                            <div>
                                <h2 className="text-sm font-bold text-gray-400 uppercase tracking-widest ml-1">Dashboard</h2>
                            </div>
                        </div>
                        <div className="flex items-center gap-4 bg-white/50 backdrop-blur-md p-2 pl-4 rounded-2xl border border-white/40 premium-shadow">
                            <div className="text-right hidden sm:block">
                                <p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Signed in as</p>
                                <p className="text-sm font-semibold text-gray-700">{user.email}</p>
                            </div>
                            <button onClick={() => confirm("ログアウトしますか？") && auth.signOut()} className="p-3 bg-white text-gray-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all-custom">
                                <IconLogout />
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Sidebar: Nursery List */}
                        <aside className={`lg:col-span-4 space-y-6 ${selectedId ? 'hidden lg:block' : 'block'}`}>
                            <div className="glass-card rounded-[2rem] p-6">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-lg font-heading font-bold text-gray-800">保育園リスト</h2>
                                    <button
                                        onClick={() => setIsAddingNursery(!isAddingNursery)}
                                        className={`p-2 rounded-xl transition-all-custom ${isAddingNursery ? 'bg-rose-100 text-rose-600 rotate-45' : 'bg-primary-100 text-primary-600 hover:scale-110'}`}
                                    >
                                        <IconPlus />
                                    </button>
                                </div>

                                {/* Search & Filter */}
                                <div className="space-y-3 mb-6">
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-4 flex items-center text-gray-400"><IconSearch /></span>
                                        <input
                                            type="text"
                                            placeholder="検索..."
                                            className="w-full pl-12 pr-4 py-3 bg-white/50 rounded-2xl border-none focus:ring-2 focus:ring-primary-500 transition-all outline-none text-sm"
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                        />
                                    </div>
                                    <select
                                        className="w-full px-4 py-3 bg-white/50 rounded-2xl border-none focus:ring-2 focus:ring-primary-500 transition-all outline-none text-sm appearance-none"
                                        value={regionFilter}
                                        onChange={e => setRegionFilter(e.target.value)}
                                    >
                                        <option value="">すべての地域</option>
                                        {regions.map(r => <option key={r} value={r}>{r}</option>)}
                                    </select>
                                </div>

                                {/* Nursery Cards */}
                                <div className="space-y-3 max-h-[500px] overflow-y-auto no-scrollbar pr-1">
                                    {isAddingNursery && (
                                        <form onSubmit={handleAddNursery} className="p-4 bg-primary-50 rounded-2xl border border-primary-100 animate-fade-in-down space-y-3">
                                            <input autoFocus placeholder="保育園名" className="w-full px-4 py-2 rounded-xl border-none text-sm focus:ring-2 focus:ring-primary-500" value={newName} onChange={e => setNewName(e.target.value)} />
                                            <input placeholder="地域（例：世田谷区）" className="w-full px-4 py-2 rounded-xl border-none text-sm focus:ring-2 focus:ring-primary-500" value={newRegion} onChange={e => setNewRegion(e.target.value)} />
                                            <button className="w-full py-2 bg-primary-600 text-white rounded-xl text-sm font-bold shadow-md">保存する</button>
                                        </form>
                                    )}

                                    {filteredNurseries.map(n => {
                                        const completed = (n.checklist || []).filter(i => i.completed).length;
                                        const total = (n.checklist || []).length;
                                        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

                                        return (
                                            <div
                                                key={n.id}
                                                onClick={() => setSelectedId(n.id)}
                                                className={`p-5 rounded-[1.5rem] cursor-pointer transition-all-custom group border ${selectedId === n.id ? 'bg-primary-600 text-white border-primary-600 premium-shadow scale-[1.02]' : 'bg-white/40 hover:bg-white/80 border-transparent'}`}
                                            >
                                                <div className="flex justify-between items-start mb-3">
                                                    <div>
                                                        <h3 className="font-bold text-base line-clamp-1">{n.name}</h3>
                                                        <p className={`text-[11px] font-bold uppercase tracking-wider opacity-60`}>{n.region || 'Unknown'}</p>
                                                    </div>
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); handleDeleteNursery(n.id); }}
                                                        className={`p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity ${selectedId === n.id ? 'hover:bg-primary-500 text-white' : 'hover:bg-rose-50 text-rose-400'}`}
                                                    >
                                                        <IconTrash />
                                                    </button>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 h-1.5 bg-black/10 rounded-full overflow-hidden">
                                                        <div className={`h-full transition-all duration-500 ${selectedId === n.id ? 'bg-white' : 'bg-primary-500'}`} style={{ width: `${percent}%` }}></div>
                                                    </div>
                                                    <span className="text-[11px] font-bold">{percent}%</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {filteredNurseries.length === 0 && (
                                        <div className="py-12 text-center">
                                            <p className="text-gray-400 text-sm font-medium">保育園が見つかりません</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </aside>

                        {/* Main: Checklist */}
                        <main className={`lg:col-span-8 ${selectedId ? 'block' : 'hidden lg:block'}`}>
                            {selectedNursery ? (
                                <div className="space-y-6">
                                    {/* Back Button (Mobile Only) */}
                                    <button
                                        onClick={() => setSelectedId("")}
                                        className="lg:hidden flex items-center gap-2 text-primary-600 font-bold text-sm mb-2 hover:translate-x-[-4px] transition-transform"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" /></svg>
                                        リストに戻る
                                    </button>

                                    {/* Stats Header */}
                                    <div className="glass-card rounded-[2rem] p-8 flex flex-col md:flex-row md:items-center justify-between gap-6 relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-primary-100 rounded-full blur-[60px] opacity-40 translate-x-10 -translate-y-10"></div>
                                        <div className="relative z-10">
                                            <h2 className="text-2xl font-heading font-bold text-gray-900 mb-1">{selectedNursery.name}</h2>
                                            <p className="text-primary-600 font-bold text-sm tracking-wide bg-primary-50 px-3 py-1 rounded-full inline-block">
                                                案内チェックリスト進捗
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-6 relative z-10">
                                            <div className="text-center">
                                                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Items</p>
                                                <p className="text-2xl font-heading font-bold text-gray-900">
                                                    {statsCompleted}<span className="text-gray-300 font-medium mx-1">/</span>{statsTotal}
                                                </p>
                                            </div>
                                            <div className="w-14 h-14 rounded-full border-4 border-primary-100 flex items-center justify-center">
                                                <span className="text-sm font-bold text-primary-600">
                                                    {statsPercent}%
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Filter Tabs */}
                                    <div className="flex p-1.5 bg-white/40 backdrop-blur-md rounded-2xl border border-white/40 premium-shadow">
                                        {[
                                            { id: 'all', label: 'すべて表示' },
                                            { id: 'completed', label: '完了のみ' },
                                            { id: 'uncompleted', label: '未完了のみ' }
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setFilterStatus(tab.id)}
                                                className={`flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all-custom ${filterStatus === tab.id ? 'bg-white text-primary-600 shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}
                                            >
                                                {tab.label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Checklist Items */}
                                    <div className="space-y-4">
                                        {filteredChecklist.map((item) => (
                                            <div
                                                key={item.id}
                                                className={`glass-card rounded-3xl p-6 transition-all-custom border-2 ${item.completed ? 'border-primary-100 bg-primary-50/30' : 'border-transparent'}`}
                                            >
                                                <div className="flex items-start gap-5">
                                                    <button
                                                        onClick={() => handleToggleItem(item.id)}
                                                        className={`mt-1 w-8 h-8 rounded-xl flex-shrink-0 flex items-center justify-center transition-all-custom ${item.completed ? 'bg-primary-600 text-white shadow-lg shadow-primary-200' : 'bg-white border-2 border-gray-200 text-transparent hover:border-primary-400'}`}
                                                    >
                                                        <IconCheck />
                                                    </button>
                                                    <div className="flex-1 min-w-0">
                                                            <div className="flex-1 flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                                                                <h3
                                                                    onClick={() => handleToggleItem(item.id)}
                                                                    className={`text-lg font-bold cursor-pointer select-none transition-colors ${item.completed ? 'text-gray-400 line-through' : 'text-gray-800'}`}
                                                                >
                                                                    {item.text}
                                                                </h3>

                                                                <div className="flex items-center gap-2">
                                                                    <div className="flex items-center bg-gray-100/50 p-1 rounded-xl border border-gray-200/50">
                                                                        <button
                                                                            onClick={() => handleUpdateItem(item.id, 'status', item.status === 'adopted' ? null : 'adopted')}
                                                                            className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${item.status === 'adopted' ? 'bg-primary-600 text-white shadow-md shadow-primary-200' : 'text-gray-400 hover:text-primary-600'}`}
                                                                        >
                                                                            導入済み
                                                                        </button>
                                                                        <button
                                                                            onClick={() => handleUpdateItem(item.id, 'status', item.status === 'not_adopted' ? null : 'not_adopted')}
                                                                            className={`px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all ${item.status === 'not_adopted' ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : 'text-gray-400 hover:text-rose-500'}`}
                                                                        >
                                                                            未導入
                                                                        </button>
                                                                    </div>
                                                                    <button onClick={() => handleDeleteItemGlobal(item.id)} className="p-2 text-gray-300 hover:text-rose-500 transition-colors">
                                                                        <IconTrash />
                                                                    </button>
                                                                </div>
                                                            </div>

                                                        {/* Memo & Dates */}
                                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                            <div className="md:col-span-2">
                                                                <MemoTextarea
                                                                    itemId={item.id}
                                                                    value={item.memo || ""}
                                                                    onCommit={handleUpdateItem}
                                                                    placeholder="メモを残す..."
                                                                    className="w-full bg-white/60 rounded-2xl p-4 text-sm border-none focus:ring-2 focus:ring-primary-500 transition-all min-h-[80px] no-scrollbar resize-none"
                                                                />
                                                            </div>
                                                            <div className="space-y-3">
                                                                <div>
                                                                    <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-1">完了日</label>
                                                                    <input
                                                                        type="date"
                                                                        className="w-full bg-white/60 rounded-xl px-3 py-2 text-xs border-none focus:ring-2 focus:ring-primary-500"
                                                                        value={item.completedDate || ""}
                                                                        onChange={e => handleUpdateItem(item.id, 'completedDate', e.target.value)}
                                                                    />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-1">Next Action</label>
                                                                    <input
                                                                        type="date"
                                                                        className="w-full bg-rose-50/50 rounded-xl px-3 py-2 text-xs border-none focus:ring-2 focus:ring-rose-400 text-rose-700"
                                                                        value={item.nextActionDate || ""}
                                                                        onChange={e => handleUpdateItem(item.id, 'nextActionDate', e.target.value)}
                                                                    />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}

                                        {filteredChecklist.length === 0 && (
                                            <div className="py-12 text-center glass-card rounded-3xl border-dashed border-2 border-gray-200">
                                                <p className="text-gray-400 text-sm font-medium">表示する項目がありません</p>
                                            </div>
                                        )}

                                        {/* Add Item Form */}
                                        <div className="pt-4">
                                            <AddItemForm onAdd={handleAddItem} />
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full min-h-[400px] flex flex-col items-center justify-center glass-card rounded-[2rem] p-12 text-center">
                                    <div className="w-24 h-24 bg-primary-50 rounded-full flex items-center justify-center mb-6 animate-float">
                                        <IconSchool />
                                    </div>
                                    <h3 className="text-xl font-heading font-bold text-gray-800 mb-2">保育園が選択されていません</h3>
                                    <p className="text-gray-500 max-w-xs">左側のリストから保育園を選択するか、新しい保育園を追加して管理を始めましょう。</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        function AddItemForm({ onAdd }) {
            const [text, setText] = useState("");
            const [isExpanded, setIsExpanded] = useState(false);

            const handleSubmit = (isGlobal) => {
                if (!text.trim()) return;
                onAdd(text, isGlobal);
                setText("");
                setIsExpanded(false);
            };

            if (!isExpanded) return (
                <button
                    onClick={() => setIsExpanded(true)}
                    className="w-full py-6 border-4 border-dashed border-gray-200 rounded-[2rem] text-gray-400 hover:border-primary-300 hover:text-primary-500 transition-all-custom font-bold text-sm flex items-center justify-center gap-2"
                >
                    <IconPlus /> 新しい案内項目を追加
                </button>
            );

            return (
                <div className="glass-card rounded-[2rem] p-8 animate-fade-in-down border-2 border-primary-100 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-2 h-full bg-primary-600"></div>
                    <h4 className="text-lg font-heading font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <span className="p-1.5 bg-primary-100 text-primary-600 rounded-lg"><IconPlus /></span>
                        新しい案内項目を追加
                    </h4>
                    <div className="space-y-6">
                        <div>
                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2">項目名</label>
                            <input
                                autoFocus
                                placeholder="例：防犯カメラの設置状況を確認"
                                className="w-full px-5 py-4 rounded-2xl bg-white border-2 border-gray-100 focus:border-primary-500 focus:ring-0 outline-none text-sm transition-all"
                                value={text}
                                onChange={e => setText(e.target.value)}
                                onKeyDown={e => {
                                    if (e.key === 'Enter' && text.trim()) handleSubmit(false);
                                }}
                            />
                        </div>

                        <div className="space-y-3">
                            <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">追加先の範囲を選択</label>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button
                                    onClick={() => handleSubmit(true)}
                                    disabled={!text.trim()}
                                    className="group flex items-center gap-4 p-4 bg-white border-2 border-gray-100 rounded-2xl text-left hover:border-primary-500 transition-all disabled:opacity-50"
                                >
                                    <div className="p-3 bg-primary-50 text-primary-600 rounded-xl group-hover:bg-primary-600 group-hover:text-white transition-colors">
                                        <IconGlobe />
                                    </div>
                                    <div>
                                        <p className="text-sm font-bold text-gray-800">すべての園に追加</p>
                                        <p className="text-[10px] text-gray-400">共通のチェック項目として登録</p>
                                    </div>
                                </button>
                                <button
                                    onClick={() => handleSubmit(false)}
                                    disabled={!text.trim()}
                                    className="group flex items-center gap-4 p-4 bg-white border-2 border-gray-100 rounded-2xl text-left hover:border-primary-500 transition-all disabled:opacity-50"
                                >
                                    <div className="p-3 bg-rose-50 text-rose-500 rounded-xl group-hover:bg-rose-500 group-hover:text-white transition-colors">
                                        <IconHome />
                                    </div>
                                    <div>
                                        <p className="text-sm font-bold text-gray-800">この園のみに追加</p>
                                        <p className="text-[10px] text-gray-400">現在表示中の園にのみ登録</p>
                                    </div>
                                </button>
                            </div>
                        </div>

                        <div className="flex justify-end pt-2">
                            <button
                                onClick={() => setIsExpanded(false)}
                                className="px-6 py-3 text-gray-400 font-bold text-sm hover:text-gray-600 transition-colors"
                            >
                                キャンセル
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
